name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35"
      - name: Check translations
        run: python3 scripts/check_localization.py
      - name: Build and verify Android app
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
